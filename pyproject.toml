[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "air-monitor"
version = "0.1.0"
description = "Local temperature and humidity monitor for the Raspberry Pi."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.8,<5",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
air-monitor = "air_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

